<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meet the Squad — Hillingdon Stags FC</title>
  <link rel="icon" type="image/png" href="assets/badge.png" />
  <link rel="stylesheet" href="css/style-v2.css" />
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="section">
    <div class="container">
      <div class="section-title"><h2>Meet the Squad</h2></div>
      <p class="muted">The lads representing the Stags this season.</p>
      <div id="squad"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/main-v2.js"></script>
<script>
document.addEventListener("stags:ready", async () => {
  const [squadData, resultsData] = await Promise.all([
    loadJSON("data/squad.json"),
    loadJSON("data/results.json")
  ]);
  if (!squadData) return;
  const results = resultsData ? await enrichResultsFromSheets(resultsData.results) : null;
  const squad = results ? applySeasonRatings(squadData.squad, results) : squadData.squad;
  renderSquad(document.getElementById("squad"), squad);
});
</script>

</body>
</html>
